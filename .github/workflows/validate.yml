name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python tools/validate_repository.py
      - run: python plugins/ppt-visual-reconstructor/scripts/inspect_pptx.py --help
      - run: python plugins/ppt-visual-reconstructor/scripts/compare_slide_images.py --help
      - run: python plugins/ppt-visual-reconstructor/scripts/prepare_image_scene.py --help
      - run: python -m unittest discover -s tests -v
      - run: node --check plugins/ppt-visual-reconstructor/scripts/mcp-server.mjs
      - run: node tests/test_mcp_server.mjs
