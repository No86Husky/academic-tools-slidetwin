name: WorkBuddy integration validation

on:
  push:
    branches:
      - feat/workbuddy-plugin
    paths:
      - ".codebuddy-plugin/**"
      - "plugins/slidetwin-workbuddy/**"
      - "workbuddy-desktop/**"
      - "docs/workbuddy/**"
      - "install-workbuddy.ps1"
      - "tools/build_workbuddy_skill.py"
      - "tools/validate_workbuddy_plugin.py"
      - ".github/workflows/workbuddy-plugin.yml"
  pull_request:
    paths:
      - ".codebuddy-plugin/**"
      - "plugins/slidetwin-workbuddy/**"
      - "workbuddy-desktop/**"
      - "docs/workbuddy/**"
      - "install-workbuddy.ps1"
      - "tools/build_workbuddy_skill.py"
      - "tools/validate_workbuddy_plugin.py"
      - ".github/workflows/workbuddy-plugin.yml"

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate existing repository
        run: python tools/validate_repository.py
      - name: Validate WorkBuddy integrations
        run: python tools/validate_workbuddy_plugin.py
      - name: Check MCP launcher syntax
        run: node --check plugins/slidetwin-workbuddy/scripts/launch-mcp.mjs
      - name: Build uploadable WorkBuddy desktop Skill
        run: python tools/build_workbuddy_skill.py
      - name: Upload WorkBuddy desktop Skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: slidetwin-workbuddy-skill
          path: dist/slidetwin-workbuddy-skill.zip
          if-no-files-found: error

  powershell-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse WorkBuddy installer
        shell: powershell
        run: |
          $path = Resolve-Path .\install-workbuddy.ps1
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host ("PARSER ERROR: " + $_.Message)
              Write-Host ("EXTENT: " + $_.Extent.Text)
              Write-Host ("LINE: " + $_.Extent.StartLineNumber)
              Write-Host ("COLUMN: " + $_.Extent.StartColumnNumber)
            }
            exit 1
          }
          Write-Host "PowerShell parser check passed."

      - name: Reject invalid elif keyword
        shell: powershell
        run: |
          $content = Get-Content -LiteralPath .\install-workbuddy.ps1 -Raw
          if ($content -match '(?m)^\s*elif\b') {
            Write-Error 'PowerShell installer contains the invalid elif keyword; use elseif.'
            exit 1
          }
          Write-Host "No invalid elif keyword found."

      - name: Verify robust prerequisite handling
        shell: powershell
        run: |
          $content = Get-Content -LiteralPath .\install-workbuddy.ps1 -Raw
          if ($content -notmatch 'Resolve-Or-InstallTool') {
            Write-Error 'PowerShell installer is missing robust prerequisite resolution.'
            exit 1
          }
          if ($content -match 'throw\s+"winget could not install') {
            Write-Error 'PowerShell installer must verify the executable after a nonzero winget result instead of failing immediately.'
            exit 1
          }
          Write-Host "Prerequisite handling checks passed."
